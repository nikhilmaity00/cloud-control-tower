name: Cloud Control Tower

on:
  pull_request:
    paths:
      - "control_tower/**"
      - "deployments/**"
      - "tests/**"
      - "requirements.txt"
      - "scripts/validate.sh"
      - ".github/workflows/control-tower.yml"

  push:
    branches:
      - main
    paths:
      - "control_tower/**"
      - "deployments/**"
      - "tests/**"
      - "requirements.txt"
      - "scripts/validate.sh"
      - ".github/workflows/control-tower.yml"

jobs:
  validate:
    name: Validate deployment policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate deployment
        run: ./scripts/validate.sh deployments/example.yaml